<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="thank.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <div class="logo-container">
                        <div class="logo">AT</div>
                        <div class="logo-text">
                            <div class="logo-main">Arina Takina</div>
                            <div class="logo-sub">Профессиональный визажист</div>
                        </div>
                    </div>
                </a>
            </div>
            
            <button class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="services.html">Услуги</a></li>
                <li><a href="portfolio.html">Портфолио</a></li>
                <li><a href="reviews.html">Отзывы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="booking.html">Запись</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Спасибо!</h1>
            <p>Ваше сообщение успешно отправлено</p>
        </div>
    </section>

    <section class="thank-you">
        <div class="container">
            <div style="text-align: center; padding: 3rem 2rem;">
                <div class="success-icon">✓</div>
                <div id="bookingDetailsContainer"></div>
                <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 3rem;">
                    <a href="index.html" class="btn-primary">Вернуться на главную</a>
                    <a href="booking.html" class="btn-secondary">Записаться еще</a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" style="text-decoration: none; color: inherit;">
                        <div class="logo-container" style="gap: 0.8rem;">
                            <div class="logo" style="width: 40px; height: 40px; font-size: 1rem;">AT</div>
                            <div class="logo-text">
                                <div class="logo-main" style="color: white; font-size: 1.3rem;">Arina Takina</div>
                                <div class="logo-sub" style="color: rgba(255,255,255,0.7);">Визажист • Горно-Алтайск</div>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="footer-links">
                    <a href="contacts.html">Контакты</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Arina Takina. Все права защищены.</p>
            </div>
        </div>
    </footer>
    
    <script src="script.js"></script>
    <script>
        // Обработка параметров из URL
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || 'Гость';
            const container = document.getElementById('bookingDetailsContainer');
            if (container) {
                container.innerHTML = `<p>${name}, я свяжусь с вами в ближайшее время!</p>`;
            }
        });
    </script>
</body>
</html>
